# 로컬 시연 설정. 얼굴 영상이 다루어지므로 이 PC 밖에서 접속할 수 없게 하고 사용 통계도 보내지 않는다.
[server]
address = "127.0.0.1"
headless = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# 야간 계기판 색. 글꼴과 경고등 색은 demo/cluster.py에 있다
[theme]
base = "dark"
primaryColor = "#36BFAE"
backgroundColor = "#1F2329"
secondaryBackgroundColor = "#2A2F37"
textColor = "#E6E8EB"
